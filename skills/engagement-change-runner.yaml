id: engagement-change-runner
name: Engagement Change Runner
description: >
  An executable pass over the source-of-truth YAML that answers "a big scope
  shift just landed mid-delivery — now what?". Given the current engagement
  state and a change event, it re-reads the risk mix and the intensity dials,
  tests whether the change crosses the product-vision line (re-opening
  Direction qualification: proceed / redirect / stop), re-staffs against the
  bench, and produces a confidence-tiered re-estimate and the next slice to
  attack — every claim traced to a named element of the model. It proposes;
  owners decide. It never silently re-scopes, re-prices, or proceeds across a
  product-vision change.
