id: staffing-bound
term: Staffing bound
definition: >
  Which capabilities a seat owns and which it can execute — at most two owned
  with Owner accountability, at most seven executable at L1–L3, and the two
  lists never overlap. Stored today under `roles/`.
not:
  - A job name. "Interface Lead" is a bound, not a role anyone is hired into.
  - A title. Bounds are internal; titles face the market.
  - A thing the site renders. Bounds stay unpublished until titles and bounds
    are designed on purpose.
see_also:
