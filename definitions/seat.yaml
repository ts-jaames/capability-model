id: seat
term: Project seat
definition: >
  What you're doing now.

  The role you occupy on a specific squad for a specific slice of work. Seats
  shift within an engagement as the work changes; the same person may sit Slice
  Builder one sprint and Governance Lead the next. Because seats are activated
  by what the work needs, their catalog lives in the operating view, not here.
not:
  - A second list to maintain alongside capabilities.
  - A title. A title is durable ownership of a capability bundle; a seat is one
    capability at one level on one engagement. Both are internal.
  - A line on a SOW. The contract buys the outcome, priced from
    capabilities-at-levels. Seats never appear.
  - A person. One person can staff a seat, or several people together can make
    up the capability at the level needed.
see_also:
