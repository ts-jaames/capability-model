id: title
term: Title
definition: >
  How clients buy: a market-facing label for a bundle of capabilities, coarse
  and stable, appearing on the rate card and optionally on a SOW. Titles are
  peer categories, not a ladder.
not:
  - A capability. A title packages capabilities; it never replaces one.
  - A level. "Product Architect" is the bundle; "L3" is the depth.
  - Seniority. That is the consultant band.
  - An entity in this model yet. Titles are named in prose, not stored as YAML.
