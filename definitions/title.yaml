id: title
term: Title
definition: >
  How we group coverage internally. A title is shorthand for a coherent bundle
  of owned capabilities. It never appears on the SOW — the client buys the
  outcome, priced from the capabilities-at-levels underneath. Titles are peer
  categories, not a ladder; seniority lives on the band and the level.
not:
  - A commercial artefact. It is not on the SOW and not on the rate card.
  - A capability. A title groups capabilities; it never replaces one.
  - A level. "Product Architect" is the bundle; "L3" is the depth.
  - Seniority. That is the consultant band.
  - A seat. A title is durable ownership; a seat is one capability at one level
    on one engagement.
