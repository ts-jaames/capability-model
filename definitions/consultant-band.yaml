id: consultant-band
term: Consultant band
definition: >
  Who you are at the firm.

  The whole-person HR identity — Senior Consultant, Principal Consultant. This
  is where career seniority lives: comp, progression band, the title on an
  offer letter. It correlates with level (a Principal is typically L3 in their
  owned capabilities) but never collapses into it — the band is per-person, the
  level is per-capability. Seniority didn't disappear from the model; it moved
  here, out of the client-facing layer, so what a client buys and how senior you
  are can be stated separately.
not:
  - A level. The band is per person; the level is per capability.
  - A title. A title groups owned capabilities; neither is what a client buys,
    and seniority lives here rather than on either.
  - A capability. Nothing is promised to a client by a band.
