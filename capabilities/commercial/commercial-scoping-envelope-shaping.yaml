capability: Commercial scoping & envelope shaping
domain: Commercial
promise: >
  Frames the deal as an envelope you can commit to: clear boundaries, room for
  what discovery turns up, so scope stops being a running fight.
client_experience: >
  A commercial envelope with fixed boundaries and batched trade-off checkpoints
  instead of line-item disputes.
sparq_how: >
  Define scope by outcomes + non-negotiable boundaries, not a feature list;
  build an explicit emergence allowance into the budget; set checkpoint gates
  where trade-offs are decided together.
levels:
  L2: Executes end-to-end independently and handles edge cases without escalating the method.
  L3: Builds guardrails, handles extreme complexity, and defines the standards others execute against.
not_at_l1: >
  Deciding which boundaries are truly non-negotiable and how much emergence to
  fund is a commercial judgment a template can frame but not make.
levels_mode: standard-ladder
agent_skills: []
