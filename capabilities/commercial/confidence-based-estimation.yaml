capability: Confidence-based estimation
domain: Commercial
promise: >
  An estimate that says plainly what we're sure about and what's still a bet,
  so you're never paying for false precision.
client_experience: >
  An estimate that separates proven cost from high-uncertainty bets, with
  confidence shown per line.
sparq_how: >
  Pull analog baselines from delivery history; tag each line proven / bounded /
  bet; show confidence bands, never a blended number.
levels:
  L2: Executes end-to-end independently and handles edge cases without escalating the method.
  L3: Builds guardrails, handles extreme complexity, and defines the standards others execute against.
not_at_l1: >
  Tagging a line proven / bounded / bet, and setting the band width, is a
  judgment about how much uncertainty the evidence actually leaves — structured
  by a guardrail, decided by a person.
levels_mode: standard-ladder
agent_skills: []
