id: product-interface-building
name: Product & interface building
description: >
  Makes the thing users actually touch real: a working, usable product,
  not a design or a prototype.
status: draft
owner: Operating Model
source: original
last_updated: 2026-08-21
domain: building

core_promise: >
  Makes the thing users actually touch real.

client_outcome: >
  A working, usable product, not a design or a prototype.

client_how: >
  We work in their design system (or stand one up), ship in small vertical
  slices, and leave templates and token sheets behind so later work does not
  require the original makers.

spark_how: >
  Component-driven delivery against a token layer. L1 work is assembly from
  guardrails. L2 covers state and edge-case interface behaviour. L3 sets the
  tokens, the component contracts, and the motion language.

default_state: >
  Standard component-driven UI using the tokenised design system, with no novel
  state model and no custom motion language.

exception_states:
  - type: skill
    id: state-architecture
    when: Complex client-side state, multi-surface sync, or a state model the tokens cannot express.
  - type: skill
    id: ui-motion-tuning
    when: Motion is part of the product language, not decoration.

l1_guardrails:
  - Component token sheet covering colour, type, space, and radius.
  - Page assembly template (Figma plus matching code scaffold) constrained to existing components.
  - Prompt pack for generating in-token components without inventing new primitives.

skills:
  - component-tokenization
  - state-architecture
  - ui-motion-tuning
