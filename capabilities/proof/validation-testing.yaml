capability: Validation & testing
domain: Proof
promise: >
  Puts the work through its paces, including the ugly edge cases a happy-path
  demo never hits, and shows what held and what didn't.
client_experience: >
  Coverage that proves it holds, with performance boundaries and known failure
  modes named.
sparq_how: >
  Run automated suites + generated edge cases; for AI features, run eval suites
  against the signal bar; archive a summary naming passes and misses.
levels:
  L1: Operates safely using defined guardrails and templates. Non-specialists execute without inventing method.
  L2: Executes end-to-end independently and handles edge cases without escalating the method.
  L3: Builds guardrails, handles extreme complexity, and defines the standards others execute against.
l1_guardrails:
  - Test-plan template
  - automated eval-suite scaffold
  - failure-summary format (must name misses)
l1_l2_boundary: >
  L1 triggers runs and fills the failure report; authoring custom generative
  suites is L2.
agent_skills: []
