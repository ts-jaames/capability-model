id: problem-framing
name: Problem framing
description: >
  Ladders an ask down to the commercial lever until the initiative can be
  said in one sentence. Distinct from direction qualification, which makes
  the proceed / redirect / stop call.
status: draft
owner: Operating Model
source: original
last_updated: 2026-08-21
domain: framing
core_promise: >
  Ladders an ask down to the commercial lever.
client_outcome: >
  The one sentence the initiative must serve.
client_how: >
  Working sessions that separate the asked-for solution from the job the
  business actually needs done.
spark_how: >
  Climb from symptom to lever. Stop when the sentence would still be true
  if the proposed build changed.
default_state: >
  An incoming ask with a named commercial context and accessible stakeholders.
