capability: AI systems engineering
domain: Building
promise: >
  AI that actually works on your real problem and your real data, not a demo
  that falls over in production.
client_experience: >
  A production-ready AI system grounded in your data, with accuracy and limits
  you can verify.
sparq_how: >
  Stand up an eval harness with golden sets before architecture; ingest domain
  data into model-agnostic context pipelines; gate deploy on eval scores, not
  demo quality.
levels:
  L1: >
    Runs the eval harness and corpus ingestion from scaffolds; doesn't touch
    model or pipeline logic.
  L2: >
    Builds and modifies the context pipelines; tunes reliability against the
    eval bar independently.
  L3: >
    Sets the eval methodology and reliability architecture others build to; owns
    what "trustworthy enough to ship" means.
levels_mode: specific
l1_guardrails:
  - Eval-harness scaffold
  - corpus-ingestion checklist
  - reliability-benchmark template
l1_l2_boundary: >
  L1 runs scaffolds and eval suites; modifying context pipelines is L2.
agent_skills: []
scope_decomposition:
  unit_definition: >
    One independent model or pipeline domain requiring its own evaluation
    harness and reliability ownership.
  scales_with_scope: true
  concurrency: concurrent
  confidence: "[UNTESTED]"
  intake_prompts:
    scope_units: >
      How many independent model or pipeline domains in this engagement each
      require their own AI Systems Engineering ownership, separate from the
      others?
    concurrency: >
      Do these instances need simultaneous attention, or can they be sequenced?
  notes: >
    Concurrency was carried over from the worked timeline example by analogy to
    core systems engineering, so it is a hypothesis, not a finding. Leverage by
    level has not been reasoned through for this capability. Do not copy the
    core systems numbers.
