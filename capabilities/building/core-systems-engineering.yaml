capability: Core systems engineering
domain: Building
promise: >
  The system underneath, built to fit your stack and hold together — something
  your own team can extend, not just inherit.
client_experience: >
  A clean architecture matched to your stack that internal teams can extend.
sparq_how: >
  Choose proven patterns matched to the constraint set; build clean seams
  across services, data, and APIs; document interfaces well enough for a
  third-party dev.
levels:
  L1: Operates safely using defined guardrails and templates. Non-specialists execute without inventing method.
  L2: Executes end-to-end independently and handles edge cases without escalating the method.
  L3: Builds guardrails, handles extreme complexity, and defines the standards others execute against.
levels_mode: standard-ladder
l1_guardrails:
  - Approved architecture-pattern catalogue
  - seam-documentation template
  - constraint-citation format
l1_l2_boundary: >
  L1 implements established patterns; architecting custom seams is L2.
agent_skills: []
scope_decomposition:
  unit_definition: >
    One independent system, subsystem, or integration domain in the
    engagement's architecture that requires its own end-to-end architectural
    judgment. For example, a legacy core, an integration layer, and a new AI
    layer each count as one scope unit if they can be worked and reasoned about
    independently of the others.
  scales_with_scope: true
  leverage_by_level:
    L1: 1 # pure execution against approved patterns, no spanning capacity
    L2: 1 # architects custom seams independently, one system at a time
    L3: 2 # sets standards others execute against; can oversee a second unit
    L4: 3 # capability-ownership altitude; direction-setting spans further before saturating
  concurrency: concurrent
  confidence: "[ASSUMED]"
  intake_prompts:
    scope_units: >
      How many independent systems, subsystems, or integration domains in this
      engagement each require their own Core Systems Engineering judgment,
      separate from the others?
    concurrency: >
      Do these instances need architectural attention at the same time, or could
      they be addressed one after another without delaying the engagement?
  notes: >
    Leverage numbers are a starting default, not derived from delivery history.
    First thing to check against real engagements before trusting the instance
    math: whether L1 and L2 leverage of 1 (zero spanning capacity) actually
    holds, or whether a strong L2 can run two low-complexity systems in
    parallel.
    Concurrency reflects the AI modernization worked example (legacy core,
    integration layer and AI layer needing simultaneous architectural
    ownership). It has not been checked against an engagement where concurrency
    turned out to be false.
