capability: Core systems engineering
domain: Building
promise: >
  The system underneath, built to fit your stack and hold together — something
  your own team can extend, not just inherit.
client_experience: >
  A clean architecture matched to your stack that internal teams can extend.
sparq_how: >
  Choose proven patterns matched to the constraint set; build clean seams
  across services, data, and APIs; document interfaces well enough for a
  third-party dev.
levels:
  L1: Operates safely using defined guardrails and templates. Non-specialists execute without inventing method.
  L2: Executes end-to-end independently and handles edge cases without escalating the method.
  L3: Builds guardrails, handles extreme complexity, and defines the standards others execute against.
l1_guardrails:
  - Approved architecture-pattern catalogue
  - seam-documentation template
  - constraint-citation format
l1_l2_boundary: >
  L1 implements established patterns; architecting custom seams is L2.
agent_skills: []
