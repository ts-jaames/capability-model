id: pricing-under-uncertainty
name: Pricing under uncertainty
description: >
  Prices validated work tight, keeps buffers directional, and spikes the
  unknown, so margin does not erode into change orders. Adjacent to
  Confidence-based estimation, which names proven vs bets; this capability
  owns how the price itself is structured so it holds.
status: draft
owner: Operating Model
source: original
last_updated: 2026-08-24
domain: commercial
core_promise: >
  Prices validated work tight, keeps buffers directional, and spikes the unknown.
client_outcome: >
  Margin that does not erode into change orders.
client_how: >
  We price what is validated tightly, keep buffers directional rather than
  padded into every line, and spike the unknown as its own number. The
  client sees where the price will hold and where it will move.
spark_how: >
  Split the price into validated, directional, and unknown. Do not hide
  uncertainty in a blended rate. Hand the estimate's signal split to
  Confidence-based estimation; keep the commercial structure here.
default_state: >
  A scoped engagement with mixed certainty and a price that still treats
  all of it as one number.
