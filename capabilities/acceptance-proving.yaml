id: acceptance-proving
name: Acceptance proving
description: >
  Proves the build meets the success bar that was agreed, not just that it
  runs, so the work is ready to bill against. Adjacent to Signal design,
  which sets the bar, and Validation & testing, which exercises the system;
  this capability owns the defensible done call.
status: draft
owner: Operating Model
source: original
last_updated: 2026-08-24
domain: proof
core_promise: >
  Proves the build meets the success bar you agreed, not just that it runs.
client_outcome: >
  A defensible "this is done, against the target we set," ready to bill against.
client_how: >
  We run the agreed bar against the build and show what passed and what
  did not. The client can accept, or refuse, against the target they set,
  not against whether the demo happened to work.
spark_how: >
  Execute against the signal bar and the outcome target. Do not treat
  "it runs" as done. Hand bar-setting to Signal design and Outcome
  definition; hand coverage work to Validation & testing.
default_state: >
  A running build with an agreed target that has not yet been proven
  against that target.
exception_states: []
