id: interface-lead
name: Interface Lead
description: >
  The primary client-facing anchor. Owns problem framing, evidence sprint
  alignment, and stage gate sign-offs. The person the client talks to.
status: draft
owner: Operating Model
source: original
last_updated: 2026-09-28
owned_capabilities:
  - product-interface-building
executable_capabilities:
  - id: problem-framing
    required_level: L2
  - id: stakeholder-alignment
    required_level: L2
demand_literacy: >
  Can tell when a brief is still a framing problem that must be decided before
  more work is built; when the client needs alignment before execution; and
  when to escalate a scope shift through the change-response doctrine.
