gaps:
  - name: bands.yaml widening
    description: >
      Maintenance metrics primarily monitor infrastructure health (error
      rates). A sensor is needed to monitor Value/Usability drift post-launch
      (adoption rates, usage depth) so the pipeline does not lose signal on a
      shipped feature nobody wants. This remains an unresolved gap; the
      tactical playbook includes a candidate widened bands.yaml design as a
      proposal, not yet ratified.
  - name: Naming the Intent Framing Session
    description: >
      The Stage 0 session itself is deliberately left undressed. Naming it
      before the shape is settled through repeated real use is an anti-pattern.
      We will call it what it is until it earns a name through institutional
      habit. This is separate from Evidence Sprint, which names the combined
      Stage 0 + Stage 1 commercial unit, not the Stage 0 session on its own.
  - name: Client-specific authority
    description: >
      How much of the Intent Framing Session includes the client versus
      internal Sparq preparation is inherently variable by design, not a gap to
      standardize away. Some engagements run heavy client involvement, others
      very little; headcount in the room has ranged from as few as 2 to as many
      as 20. This is engagement-specific and should stay that way.

