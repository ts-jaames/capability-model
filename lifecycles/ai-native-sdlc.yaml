id: ai-native-sdlc
name: AI-Native SDLC
summary: >
  Standard operating procedures for the Sparq AI-Native Software Development
  Life Cycle. Adapted from the Anthropic AI-Native SDLC pattern, this
  methodology integrates the Evidence Gate as a non-negotiable gate inside the
  pipeline rather than treating it as an external meta-process.
description: >
  The base pipeline optimizes for speed and build correctness. However, it
  requires a mechanism to validate whether we are building the right thing
  before scaling execution. Therefore, the Evidence Gate explicitly gates the
  transition from Intent Framing to Design, closing with the tracker sync and
  merge that was previously modeled as its own Plan stage, now folded into the
  Gate as its automatic closing action rather than a separate decision point.
  The commit chain (Git-tracked artifacts at every stage) remains both the
  operational workflow and the audit trail.
pipeline_note: >
  Pipeline is 7 stages, not 8. Stages 0 and 1 together are sold commercially
  as one unit, the Evidence Sprint, matching how discovery has traditionally
  been packaged, just with real signal behind it.
companion: tactical-playbook.html

commercial_unit:
  name: Evidence Sprint
  stages: [0, 1]
  description: >
    The thing that used to be pitched as discovery, now scoped to roughly 2
    weeks because the output is evidence and a costed Build decision, not a
    stack of workshop artifacts.
  agentic_note: >
    In agentic mode the Evidence Sprint also covers agent-specific scope
    framing, architecture definition, and simulation before committing to a
    full build.

agentic_mode:
  name: ADLC
  summary: >
    Agentic Delivery Life Cycle. Standard operating procedures for engagements
    where the deliverable is itself an agentic system, a runtime that reasons
    non-deterministically, selects tools dynamically, and operates under a
    probabilistic accuracy distribution rather than a fixed spec. It is the
    mode this pipeline runs in when the deliverable is agentic, not a second
    pipeline: the same seven stages, gates, and artifacts, with extra checks at
    most stages and a real fork at Design and Test.
  question: >
    Is the deliverable's runtime behavior fixed at build time, or decided at
    runtime?
  asked_at: 0
  decided_at: 1
  description: >
    Software delivery runs on a spectrum of how much of the system's behavior is
    fixed at build time versus decided at runtime. SDLC: everything is
    deterministic, inputs map predictably to outputs through logic fully
    specified at compile time. AI-Native SDLC: the deployed system is
    deterministic, but AI accelerates how we build it. ADLC: nothing at runtime
    is deterministic, the deliverable reasons, selects tools, and adapts to
    shifting context live.

    ADLC governs the third case. The distinction that matters commercially: a
    client buying software that uses AI in its construction is a conventional
    build. A client buying a system that is an agent, one whose actions at
    runtime are not fully predictable in advance, is buying something that needs
    its own governance model, because "did we build it right" and "does it
    behave correctly" are no longer the same question. Evaluations, not test
    suites, become the primary way we know whether the system is doing its job.
  pipeline_note: >
    Stages 0 and 1 together are the Evidence Sprint. Stages 2 through 6 are the
    Production Build. Stage 6 feeds back into Stage 0 via a recursive feedback
    loop.
  strategic_alignment:
    - name: Workflow-First Engineering
      description: >
        Unconstrained agent autonomy compounds errors. Default to deterministic
        Workflows (Prompt Chaining, Routing, Parallelization,
        Orchestrator-Workers); escalate to fully autonomous Agents only when
        dynamic reasoning across an open-ended tool space is genuinely required.
    - name: Evaluation-Driven Development
      description: >
        Evaluations replace unit tests as the core specification artifact.
        Prompts and orchestrators are software components whose behavior is
        verified against 20-50+ task scenarios before production deployment.
    - name: MCP Integration
      description: >
        Every tool, legacy connection, and enterprise platform the agent touches
        is exposed via Model Context Protocol. This decouples model logic from
        infrastructure, standardizes authentication, and enforces isolation
        boundaries.
    - name: Repo-Native Context Engines
      description: >
        Agent orchestration logic, instructions, skills, and guardrails live
        directly in the repository via CLAUDE.md. Project context is maintained
        dynamically, not through ad-hoc system prompts.
  core_shifts:
    - dimension: Behavioral model
      conventional: Deterministic execution (input maps predictably to output)
      agentic: Probabilistic execution (input, reasoning, one of several possible outputs)
    - dimension: Logic residency
      conventional: Code and config alone
      agentic: Code, system prompts, foundation models, and vector stores together
    - dimension: Primary artifact
      conventional: Code, tests, documentation
      agentic: Agent specs, evaluation suites, MCP tool definitions, CLAUDE.md context engine
    - dimension: Quality verification
      conventional: Pass/fail unit tests and code coverage
      agentic: Evaluation suites, alignment tests, and tool-call accuracy
    - dimension: Success metrics
      conventional: Code coverage and functional pass/fail
      agentic: Accuracy distributions, hallucination rates, and token economics
    - dimension: Feedback loop
      conventional: Reactive (users report bugs, devs fix them)
      agentic: Recursive (runtime telemetry feeds evaluations and re-opens intent triage automatically)
  commercial_constraints:
    - constraint: Commercial risk
      response: >
        A fixed-fee Evidence Sprint (Stages 0-1) with an explicit Evidence Gate
        caps unbounded R&D spend before architecture work begins.
    - constraint: Legacy systems
      response: >
        Monolithic and tech-debt codebases are wrapped behind strict MCP
        boundaries and path-blocking guardrails to prevent unauthorized
        refactoring.
    - constraint: Severe unknowns
      response: >
        Greenfield exploration is constrained via Plan Mode First and synthetic
        dry-run simulation before production tokens are spent.
    - constraint: SLA realities
      response: >
        Bounded accuracy distributions replace binary SLAs; post-launch
        maintenance becomes an ongoing governance retainer tracking drift, not
        just uptime.
    - constraint: Token economics
      response: >
        CAPEX/OPEX budgets are set at Design and tracked through Maintain.
        Ongoing inference cost is a first-class constraint, not an afterthought.
  domain_notes:
    - domain: commercial
      note: >
        Commercial frames the pipeline: a fixed-fee Evidence Sprint caps
        unbounded R&D spend, and token economics are tracked as a first-class
        constraint from Design through Maintain.
    - domain: enablement
      note: >
        Enablement activates at Deployment and Governance, where HITL operators
        manage autonomy tiers and the system transitions to ongoing governance.
  gaps:
    - name: Autonomy Matrix standardization
      description: >
        The matrix is currently defined per project at Design. Whether a
        baseline matrix template should exist for common agent categories (chat
        interface, workflow automation, autonomous research) is unresolved.
    - name: Token economics benchmarking
      description: >
        CAPEX/OPEX budgets are currently set per engagement without a
        portfolio-level baseline to compare against. This should mature as more
        engagements accumulate data.
    - name: Drift and hallucination bands
      description: >
        The widened performance-band design that includes token and drift
        metrics is proposed, not yet ratified in production.

stages:
  - number: 0
    name: Intent Framing
    objective: >
      In an AI-native model, writing code is fast, which means running in the
      wrong direction happens at lightspeed too. Stage 0 is not about solutions
      or specs. It is about getting brutally honest about what is known versus
      what is merely guessed, before speed gets applied to the wrong problem.
    framing: >
      Kickoff meetings produce polite agreement, everyone nods along while
      vocabulary gaps and hidden risks sit underneath. intent.md exists to
      reject that agreement. It captures business goals, affected systems, and
      constraints as a structured inventory of tagged assumptions, not settled
      facts.
    framing_benefits:
      - >
        Bridges vocabulary gaps: aligns client leadership and engineering on
        the precise problem before anyone talks tools or tactics.
      - >
        Eliminates false confidence: converts workshop optimism into testable
        hypotheses that require empirical proof.
      - >
        Protects capital and focus: turns vague project risk into a sharp
        checklist, so budget only goes toward validated ideas.
    framing_coda: >
      Stage 0 is not limited to fresh kickoffs. A standard feature request, or
      even a production incident surfacing back through Stage 6 (Maintain),
      enters the pipeline through this same gate and gets tagged the same way
      before anything advances.
    artifact: raw intent.md
    gate: —
    primary_domain: framing
    risk_shapes_hot:
      - shape-problem-clarity
      - shape-commercial
    procedures:
      - name: Governance
        description: >
          Every intent.md, whether written by a human or generated by a
          background agent, must be reviewed and corrected by the Product Owner
          before it proceeds.
      - name: Mode question
        description: >
          Ask the one question that sets the rest of the pipeline: is the
          deliverable's runtime behavior fixed at build time, or decided at
          runtime? A fixed answer keeps the pipeline in its standard mode. A
          runtime answer puts it in agentic mode (ADLC), which adds checks at
          most stages and changes Design and Test.
    output: >
      Fully tagged, human-readable stack of assumptions. Advances directly to
      Stage 1 (Evidence Gate) for empirical testing. Inert: does not trigger
      any automated build or CI run.
    note: Evidence Sprint
    adaptation:
      approach: >
        Structured elicitation producing tagged, unvalidated assumptions.
      governance: Product Owner reviews every intent.md before it proceeds.
    agentic:
      divergence: additive
      objective: >
        Prevent over-engineering by establishing whether an agentic architecture
        is actually necessary before writing any code. Surface business value,
        feasibility bounds, and, because the deliverable will reason and act on
        its own, the specific ways an autonomous system can fail that a
        conventional build never has to consider.
      framing: >
        Extend the failure premortem explicitly to agentic failure modes:
        compounding tool calls, runaway loops, data leakage through tool access.
        This is the one place Stage 0 diverges from a conventional build. The
        question is not just "what if this fails," it is "what if this decides
        something we did not intend."
      gate: Facilitator validates assumption tagging including agentic failure modes
      risk_shapes_hot:
        - shape-ai-reliability
      procedures:
        - name: Structured workshop
          description: >
            Silent assumption dump across five risk lenses (Value, Usability,
            Feasibility, Viability, Operational), followed by a failure
            premortem extended to agentic failure modes.
        - name: Assumption tagging
          description: >
            Tag every claim explicitly. No untagged assertions survive the file.
      output: >
        intent.md: a fully tagged, human-readable stack of assumptions,
        including agentic-specific risk. Inert until it clears the Evidence
        Gate.
      adaptation:
        approach: >
          Structured elicitation surfacing both business and agentic-failure
          risk.
        governance: >
          Facilitator ensures assumption tagging, including failure-mode
          coverage.

  - number: 1
    name: Evidence Gate
    objective: >
      Decide whether the raw intent.md is trustworthy enough to compile into
      spec.md. This is a human-driven evaluation gate to validate risk
      categories that cannot be caught by CI rubrics. On a Promote, the gate
      closes automatically: tracker sync, merge, and spec compilation fire
      without a separate decision.
    artifact: intent.md (cleared, synced)
    gate: Promote / Iterate / Pivot / Stop + PO merge
    primary_domain: proof
    secondary_domain: framing
    risk_shapes_hot:
      - shape-value
      - shape-problem-clarity
    risk_routing:
      - category: Feasibility
        tested_at: Stage 4 (CI Eval Suite)
        rationale: Deterministic; a rubric can check whether code fulfills a spec.
      - category: Operational
        tested_at: Stage 4 (CI Eval Suite)
        rationale: Testable against known patterns and thresholds.
      - category: Value
        tested_at: Evidence Gate
        rationale: Requires external reaction. Cannot be skipped or auto-evaluated.
      - category: Usability
        tested_at: Evidence Gate
        rationale: Requires human interaction/reaction. Cannot be skipped.
      - category: Viability
        tested_at: Evidence Gate (Light)
        rationale: Business/commercial sense-check.
    procedures:
      - name: Validation loop
        description: >
          Run the cycle of Risk → Assumption → Slice → Signal → Confidence →
          Decision on tagged assumptions. Address one assumption per slice. The
          validation loop is prototyping: build the smallest thing that tests
          one assumption, read the signal, decide.
      - name: Test in the real world
        description: >
          For Value/Usability risks, attach the test to a real occasion (next
          client conversation, stakeholder review, prospect encounter) rather
          than manufacturing synthetic scenarios. A slice needs something
          behaving in the world to react to.
      - name: Internal convergence
        description: >
          Only use internal convergence checks when a real external occasion
          genuinely does not exist. Record the reason explicitly. Internal-only
          signals cap at Directional confidence, never Validated.
      - name: Explicit decisions
        description: >
          Make a clear decision for the intent: Promote, Iterate, Pivot, or
          Stop. No numeric confidence scores.
      - name: Close the gate
        description: >
          Once Promote is decided, immediately execute the dual-linkage:
          Markdown remains the operational source of truth in the repository,
          synced to legacy enterprise trackers (Jira/Azure DevOps) via MCP
          connectors for client governance. This merge triggers a
          non-interactive CI job that compiles spec.md, loading Sparq compliance
          skills (security, UX, brand guidelines). The Product Owner performs
          the final review.
      - name: Record the mode
        description: >
          Write the answer to the mode question into the cleared intent.md so
          Design starts in the right mode. The question is asked once, here, and
          not re-argued at each later stage.
    output: >
      The intent.md either clears (merged, synced, and moving to Stage 2) or
      gets sent back to Stage 0 for re-framing, or the initiative is
      stopped/pivoted.
    note: Evidence Sprint
    adaptation:
      approach: >
        Risk validation loop for Value/Usability/Viability, closing
        automatically into tracker sync and spec compilation on Promote.
      governance: >
        Product + Delivery sign-off; Promote/Iterate/Pivot/Stop, then PO merge.
    agentic:
      divergence: additive
      objective: >
        Decide whether the intent is trustworthy enough to justify architecture
        investment before any agent design work begins. For agentic systems this
        gate carries more weight than in a conventional build, because
        architecture decisions here (tool access, autonomy scope) are expensive
        to unwind once made.
      risk_shapes_hot:
        - shape-ai-reliability
      procedures:
        - name: Evidence Slice or Vision Prototype
          description: >
            Build a lightweight slice or a fuller prototype addressing the
            highest-risk assumption.
        - name: Adversarial simulation
          description: >
            Run multi-persona synthetic simulations that deliberately introduce
            ambiguous, malformed, or malicious inputs, stress-testing not just
            whether the system works but how it fails when it does not.
      output: >
        intent.md (cleared and synced to the enterprise tracker) and, where
        built, a Vision Prototype demonstrating future-state value.
      adaptation:
        approach: >
          Risk validation loop stress-tested against adversarial input, closing
          automatically on Promote.
        governance: >
          Explicit Promote/Iterate/Pivot/Stop, then merge sign-off.

  - number: 2
    name: Design
    objective: >
      Synthesize requirements and architecture into a formal specification.
    artifact: spec.md
    gate: Skills validation
    primary_domain: building
    secondary_domain: framing
    risk_shapes_hot:
      - shape-feasibility
    procedures:
      - name: Compressed synthesis
        description: >
          Execute a compressed, single-session requirements and architecture
          synthesis.
      - name: Skill integration
        description: >
          Guide the synthesis utilizing organization-wide skills for security,
          compliance, and UX standards.
      - name: Domain focus
        description: >
          Building is the primary domain: product-interface-building and
          core-systems-engineering drive the synthesis. Framing
          constraint-checks run as secondary, ensuring the architecture stays
          within the boundaries set at the Evidence Gate.
    output: spec.md.
    adaptation:
      approach: Compressed single-session requirements and design synthesis.
      governance: Skills validation (Security, UX, Brand).
    agentic:
      divergence: fork
      objective: >
        Design the non-deterministic system architecture itself, not just a
        technical spec but the boundaries of what the deployed agent will be
        allowed to decide and do. This is where building an agent most clearly
        diverges from using one to build: the deliverable's own runtime
        authority has to be designed on purpose.
      artifact: spec.md + autonomy-matrix.yaml
      gate: Security and architecture sign-off
      risk_shapes_hot:
        - shape-ai-reliability
      procedures:
        - name: Architecture session
          description: >
            Compressed design session defining the model stack, context engine
            structure, prompt topologies, and MCP tool schemas.
        - name: Autonomy Matrix
          description: >
            Map every task category the deployed agent will perform to an
            explicit authorization level: Autonomous, Automated with Logging,
            HITL Approval Required, or Prohibited. This is a strategic decision
            made once per system, not a detail to leave implicit until Deploy.
        - name: Token economics
          description: >
            Set CAPEX/OPEX budgets as a first-class design constraint alongside
            functional requirements.
        - name: Guardrail validation
          description: >
            Validate the spec against organizational security,
            prompt-validation, and output-parsing guardrails before
            implementation begins.
      output: >
        spec.md: a complete technical blueprint covering MCP tool definitions,
        the Autonomy Matrix, token budgets, context structure, and failure
        recovery protocols.
      adaptation:
        approach: >
          Architecture synthesis including an explicit Autonomy Matrix and token
          budget.
        governance: Security and architecture sign-off.

  - number: 3
    name: Build
    objective: >
      Draft implementation plans and execute code generation within isolated
      agent environments.
    artifact: plan.md + code diffs
    gate: CLAUDE.md + hooks
    primary_domain: building
    secondary_domain: proof
    risk_shapes_hot:
      - shape-feasibility
      - shape-ai-reliability
    procedures:
      - name: CLAUDE.md context engine
        description: >
          Maintain a robust context engine detailing build commands, linting
          rules, architectural patterns, and team-specific mistakes to avoid.
      - name: Plan mode as default
        description: >
          AI agents must draft plan.md before writing code. Human acceptance
          commits the plan to Git.
      - name: Parallel worktrees
        description: >
          Isolate agent sessions across separate Git worktrees. Enforce a
          parallel session cap of 2–3 concurrent worktree sessions per engineer
          to preserve review quality and prevent fatigue.
      - name: Scoped auto mode
        description: >
          Allow autonomous edit execution only where existing test coverage and
          build hooks are fully mature.
      - name: Shared subagents
        description: >
          Utilize .claude/agents/ to store standardized helper agents across
          repositories, including verifier agents (run the app, check behavior) and
          simplifier agents (strip redundant complexity post-implementation).
    output: plan.md and verified code diffs.
    adaptation:
      approach: Plan-mode drafting, worktree-isolated implementation.
      governance: CLAUDE.md + path-blocking hooks.
    agentic:
      divergence: additive
      objective: >
        Execute engineering work under Evaluation-Driven Development, treating
        evaluations as the specification that governs whether the system is
        behaving correctly, not just whether it compiles.
      artifact: plan.md + code diffs + initial eval benchmarks
      gate: Engineer plan acceptance + evaluation coverage check
      procedures:
        - name: Evaluation-Driven Development
          description: >
            Draft initial evaluation scenarios in parallel with feature code,
            not after it, because for a probabilistic system the eval suite is
            part of the spec, not a downstream check on it.
        - name: Continuous model evaluation
          description: >
            Evaluate model outputs continuously during implementation for
            hallucination rate, formatting errors, and tool-calling accuracy,
            alongside standard build verification.
      output: >
        An accepted implementation plan, verified code diffs in isolated
        branches, and initial evaluation benchmarks.
      adaptation:
        approach: >
          Plan-mode drafting with evaluation scenarios built alongside code.
        governance: Engineer plan acceptance + evaluation coverage check.

  - number: 4
    name: Test
    objective: >
      Continually verify code behavior and assess Feasibility and Operational
      risks through automated CI suites.
    artifact: verification logs + eval results
    gate: Eval pass thresholds
    primary_domain: proof
    secondary_domain: building
    risk_shapes_hot:
      - shape-proof
      - shape-feasibility
      - shape-ai-reliability
    procedures:
      - name: Self-verification loop
        description: >
          Agents must run builds, tests, and visual diffs, proving success in
          context before reporting a task complete.
      - name: Continuous CI eval suite
        description: >
          Maintain 20–50 real-world task evaluations in
          .github/workflows/agent-evals.yml. These run non-interactively upon
          updates to code, skills, or hooks to establish baseline agent
          performance benchmarks.
      - name: Focused scope
        description: >
          CI evaluations assess Feasibility and Operational risks only. Value
          and Usability risks are resolved upstream at the Evidence Gate
          (Stage 1).
      - name: Test-file locking
        description: >
          Implement pre-tool hooks that block agents from modifying existing
          test files during bug-fix tasks. The agent must fix the code to pass
          the tests; it is explicitly denied the ability to alter assertions
          to force a passing status.
    output: Verification logs and evaluation results.
    adaptation:
      approach: Continuous self-verification and CI-driven eval suites.
      governance: Test-locking hooks and eval pass thresholds.
    agentic:
      divergence: fork
      objective: >
        Validate the system across non-deterministic outputs. A probabilistic
        system can pass every functional test and still fail on tool selection
        or safety alignment. Those need their own verification, not an
        assumption that functional correctness implies behavioral correctness.
      gate: Combined threshold on accuracy, safety, and tool-selection
      procedures:
        - name: Combined threshold
          description: >
            Gate merges on a combined threshold covering task accuracy, safety
            alignment, and tool-selection accuracy, not task accuracy alone.
            All three axes must pass independently.
      output: Execution logs and a comprehensive evaluation pass report.
      adaptation:
        approach: >
          Combined accuracy, safety, and tool-selection threshold.
        governance: Automated CI gate on all three axes.

  - number: 5
    name: Deploy
    objective: >
      Conduct multi-pass reviews and securely deploy artifacts across
      environments using defined autonomy tiers.
    artifact: REVIEW.md + PR findings
    gate: Environment autonomy tiers
    primary_domain: building
    secondary_domain: continuity
    risk_shapes_hot:
      - shape-proof
      - shape-adoption
    procedures:
      - name: Multi-pass PR review
        description: >
          Automate first-pass scans for logical bugs, security gaps, and
          compliance against spec.md and plan.md (REVIEW.md).
      - name: Hooks as release gates
        description: >
          Enforce deterministic pre-execution scripts for security controls,
          blocking unauthorized path edits.
      - name: Environment tiers
        description: >
          Dev/Sandbox: full agent execution allowed. Staging: automated PR
          review with passing CI required. Production: explicit human
          release-manager authorization required.
      - name: Managed settings
        description: >
          Deploy immutable settings centrally (e.g., allowManagedHooksOnly,
          permissions.deny) to block shell network egress, prevent credential
          leakage, and disable plugin sideloading.
    output: REVIEW.md, PR findings, and deployed code.
    adaptation:
      approach: Multi-pass agentic PR review with human risk evaluation.
      governance: Branch protection and production deploy hooks.
    agentic:
      divergence: additive
      objective: >
        Transition a probabilistic system into staging and production safely,
        using tiered autonomy and multi-pass safety verification rather than a
        single go/no-go review.
      artifact: REVIEW.md + PR findings + release record
      gate: Named human sign-off on Production actions above threshold
      procedures:
        - name: Tiered autonomy
          description: >
            Deploy through managed autonomy tiers: full autonomy in
            Development, automated review plus clean CI in Staging, and
            explicit named human sign-off in Production for any action above
            the defined risk threshold.
        - name: Context-engine correction
          description: >
            Feed corrections back automatically: when the same mistake recurs
            across reviews, the context engine is updated so it does not recur a
            third time.
      output: >
        Review findings, environment deployment logs, and a signed production
        activation record.
      adaptation:
        approach: >
          Tiered autonomy with automatic context-engine correction.
        governance: Named human sign-off on Production actions above threshold.

  - number: 6
    name: Maintain
    objective: >
      Monitor system health continuously and trigger automated triage and
      incident resolution loops.
    artifact: bands.yaml + incident records
    gate: Metric-band triggers
    primary_domain: continuity
    secondary_domain: enablement
    risk_shapes_hot:
      - shape-continuity
      - shape-adoption
    procedures:
      - name: Metric drift triggers
        description: >
          Apply deterministic monitoring using statistical control rules against
          operational metrics (e.g., test failure rate, post-deploy 5xx rates)
          via bands.yaml.
      - name: Autonomous intent feed
        description: >
          If a metric breach occurs (e.g., 3σ deviation), a background agent
          automatically diagnoses the root cause and writes a new intent.md into
          the triage queue.
      - name: ChatOps incident response
        description: >
          Triage live production alerts via Claude Tag in Slack/Teams, execute
          diagnostic runbooks via MCP, and log root-cause analyses directly to
          the thread record.
      - name: Incident-to-eval pipeline
        description: >
          For every resolved production incident, automatically compile a
          regression evaluation case into the CI suite (Stage 4) to guarantee
          prevention of recurrence.
    output: bands.yaml updates and incident/eval loop records.
    adaptation:
      approach: Metric-band monitoring auto-generating new intent items.
      governance: Tiered automated response and on-call approval.
    agentic:
      divergence: additive
      name: Maintain & Governance
      objective: >
        Manage probabilistic drift over time: monitor token consumption, capture
        real-world edge cases the system encounters in production, and feed
        incidents back into intent triage automatically rather than waiting for
        the next planning cycle.
      gate: Automated triage feed + quarterly governance review
      procedures:
        - name: Statistical process control
          description: >
            Monitor performance using statistical process control against
            defined bands, extended for agentic systems to include token
            consumption trends and hallucination/drift rates alongside
            infrastructure and product metrics.
        - name: Automated incident triage
          description: >
            On a detected anomaly (a hallucination, an autonomy-boundary breach,
            a negative feedback loop) a background process diagnoses the
            incident, compiles a permanent regression case, and raises a new
            intent item automatically.
        - name: Quarterly governance review
          description: >
            Review governance quarterly against accumulated incident and drift
            data.
      output: >
        Updated performance bands, incident post-mortem records, and new intent
        items entering the triage queue.
      adaptation:
        approach: >
          Metric-band monitoring extended to token and drift metrics.
        governance: Automated triage feed + quarterly governance review.

domain_notes:
  - domain: commercial
    note: >
      Commercial frames the pipeline: it sets the envelope and price before
      Stage 0, and the proof → commercial seam updates it as evidence arrives.
      It is not absent from the pipeline; it operates across stages rather than
      owning one.
  - domain: enablement
    note: >
      Enablement activates when the Adoption risk shape fires, typically
      hottest at Deploy and Maintain but possible at any stage where
      organizational change is needed to land the work.

raci:
  - stage: 0
    assignments:
      - title: product-architect
        designation: A
      - title: forward-deployed-engineer
        designation: C
      - title: applied-ai-engineer
        designation: C
      - title: eval-quality-engineer
        designation: I
      - title: engagement-lead
        designation: C
  - stage: 1
    assignments:
      - title: product-architect
