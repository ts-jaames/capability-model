id: intensity-scale
name: Intensity scale
description: >
  Every capability sits on a four-step dial at all times. The live risk mix
  moves the dials. Dials describe how hot a capability is running right now;
  they are not a maturity or seniority scale.
status: draft
owner: Operating Model
source: original
last_updated: 2026-09-09

risk_questions:
  - question: How much rides on it?
    answers_to: level
    behaviour: >
      Stable. It does not move as the work progresses — what is at stake was
      settled when the work was scoped.
  - question: How sure are we?
    answers_to: intensity
    behaviour: >
      Moves. Low confidence on something that matters drives its capability to
      Peak; as we prove it out, it cools.

dial_placement: >
  The dial is a label on the capability, never on the risk or the product item.

dials:
  - id: dormant
    name: Dormant
    description: present but idle; re-activates on the right signal
  - id: low
    name: Low
    description: live but light — a check or a spike
  - id: active
    name: Active
    description: a primary workstream now
  - id: peak
    name: Peak
    description: the dominant demand

floor_note: >
  Dormant is not absent. Capabilities turn down, never off.
