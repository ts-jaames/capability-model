<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Patrick Hand";
    src: url("assets/PatrickHand-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }
  html, body { margin: 0; padding: 0; background: #f7f5ef; }
  #board { display: block; }
</style>
</head>
<body>
  <canvas id="board" width="1920" height="1080"></canvas>
  <script src="dist/scene.bundle.js"></script>
  <script>
    window.__ctx = document.getElementById("board").getContext("2d");
    window.__renderAt = (t) => window.Explainer.renderFrame(window.__ctx, t);
  </script>
</body>
</html>
