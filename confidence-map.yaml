id: confidence-map
name: Status & Pilot Readiness
description: >
  How far each part of the operating model has been tested, and when it could
  be used on real work. Dates are estimates and never move a part.
status: draft
owner: Operating Model
source: original
last_updated: 2026-10-09
positions_reviewed: false

# Shown under the two hero answers. Parts pilot on their own as soon as they are
# ready, so only a part that needs the others has to wait.
pilot_principle: >
  Parts pilot as soon as they're ready, manually if needed; only the staffing
  harness has to wait for the others.

# Shown in the tooltip on the "Part of the model" column header.
reading_rule: >
  A part moves right only after real work holds it up, and moves back left if
  real work breaks it. A group sits in the column of its least tested part.

note: >
  This file is edited by a human. Nothing in it moves on its own, and no
  assistant promotes a part without being told to. `positions_reviewed` stays
  false until a human has gone through and set where each part really sits.

  `last_moved` records when a part last changed column, which is history.
  `moves_when` records what has to be true for it to move right. Future dates
  appear only as estimate windows, each an earliest and latest date with
  `confirmed: false` until a human confirms it. An assistant may seed a window
  but never confirms one. The hero range is worked out from the parts and is
  never typed here.

  Mapping looks back and pilot looks forward. A part states one `mapping.test`
  and one `pilot.test`, each a single sentence. A part with no `pilot.test` has
  no pilot window and is left out of the range. A manual or spreadsheet run
  counts as a pilot; automation is not a gate.

  A row with parts sits where its weakest part sits. Do not set `position` on a
  row that has `items`; it is worked out from them. A part with a `stage`
  takes its name from the lifecycle named on the row, so a renamed stage cannot
  leave this file stale.

# Mapping draws on running engagements and recently finished projects, referred
# to by count only. A part is ready to leave mapping when this share of what it
# claims has been seen holding up in them. Every figure here is an estimate.
mapping_engagements_target:
  min: 2
  max: 3
  estimate: true
recent_projects_target:
  min: 3
  max: 4
  estimate: true
coverage_to_advance:
  min: 0.75
  max: 0.80
  estimate: true

columns:
  - id: thinking
    name: Thinking Time
    tag: Thinking time
    meaning: >
      We have written it down and talked it through. We have not tried it on
      real work yet.
  - id: mapping
    name: Current engagement mapping
    tag: Mapping
    meaning: >
      Looks back. Does this part explain real work we have already done, in
      running engagements and recently finished projects?
  - id: pilot
    name: Pilot use
    tag: Pilot use
    meaning: >
      Looks forward. We use this part on an upcoming real project and compare
      the result later. A manual or spreadsheet run counts, and a pilot should
      be the smallest chunk that gives real feedback.

rows:
  - id: operating-view
    name: Operating View
    status: draft
    thinking_end: { earliest: 2026-10-30, latest: 2026-11-20, confirmed: false }
    mapping:
      test: >
        Candidate: apply risk shapes and seams to past projects, and check
        whether they flag where those projects went sideways.
      ends: { earliest: 2026-11-27, latest: 2026-12-18, confirmed: false }
    depends_on:
      - id: ai-native-sdlc
        reason: >
          Risk shapes run hot at particular stages, so they follow the
          lifecycle's stage map.
    items:
      - name: Risk Shapes
        position: thinking
      - name: Seams
        position: thinking
      - name: When work changes
        position: thinking

  - id: ai-native-sdlc
    name: AI-Native SDLC
    lifecycle: ai-native-sdlc
    thinking_end: { earliest: 2026-10-30, latest: 2026-11-20, confirmed: false }
    mapping:
      skip: Past projects did not follow it, so there is nothing to look back at.
    pilot:
      test: Run Stages 0–1 on the next discovery, manually.
      mode: silo
      silo_scope: One stage range at a time, starting with the next discovery.
      label: Stages 0–1
      starts: 2026-11-09
      window: { earliest: 2026-11-25, latest: 2026-11-30, confirmed: false }
      not_yet: Stages 2–6 wait for a build engagement.
    items:
      - stage: 0
        position: thinking
      - stage: 1
        position: thinking
      - stage: 2
        position: thinking
      - stage: 3
        position: thinking
      - stage: 4
        position: thinking
      - stage: 5
        position: thinking
      - stage: 6
        position: thinking
      # The two stages where agentic mode forks in kind, not just adds checks.
      # They are tested on their own, so the shared stages can sit further right.
      - name: Agentic mode, Design (Autonomy Matrix)
        position: thinking
      - name: Agentic mode, Test (combined threshold)
        position: thinking

  - id: capability-model
    name: Capability Model
    mapping:
      test: Do the past 3–4 projects surface capabilities missing from the list?
      ends: { earliest: 2026-10-30, latest: 2026-11-06, confirmed: false }
    pilot:
      test: >
        Run an upcoming project's qualify and discovery transcripts through the
        model, and record which capabilities surface at which levels.
      mode: silo
      silo_scope: One upcoming project's qualify and discovery transcripts.
      starts: 2026-11-09
      window: { earliest: 2026-11-21, latest: 2026-11-25, confirmed: false }
    items:
      - id: domains
        name: Domains
        position: mapping
      - id: capabilities
        name: Capabilities
        position: mapping
      - id: capability-levels
        name: Capability Levels
        position: mapping
        depends_on:
          - id: operating-view
            reason: >
              Risk shapes and dials say how hard a capability runs, which is
              what a level has to be able to describe.
          - id: staffing-harness
            real: false
            reason: >
              Staffing runs should show where a level was set wrong. This
              feedback does not exist until the harness has run once.

  - id: sizing-staffing-rules
    name: Sizing & Staffing Rules
    note: >
      Covers how many instances and seats a piece of work needs, from scope
      units, required level and capacity, and the checks that keep a staffing
      allowed, such as build and QA separation and operator eligibility. The
      individual rules are kept in the model file.
    depends_on:
      - id: ai-native-sdlc
        reason: >
          What counts as one unit depends on how the work is cut into stages.
    items:
      - id: scope-units
        name: Scope Units
        kind: measure
        statement: >
          How many independent instances of a capability an engagement needs,
          as opposed to how senior the work is.
        formula: instances = ceil(scope_units / leverage_by_level[level])
        inputs:
          - scope units (per engagement, never stored)
          - leverage by level
          - level
        tool: size
        glossary_terms: [scope-unit, level]
        lives_in: >
          capabilities/building/core-systems-engineering.yaml
          (scope_decomposition); the only capability with one so far.
        position: thinking
        moves_when: >
          Core Systems Engineering leverage is checked against a real engagement,
          concurrency is checked against one where it turned out to be wrong, and
          a second capability has had its own scope pass.
        thinking_end: { earliest: 2026-10-23, latest: 2026-10-30, confirmed: false }
        mapping:
          test: >
            Size each past project with the rules and compare against what actually
            happened, one sub-rule at a time.
          ends: { earliest: 2026-11-02, latest: 2026-11-25, confirmed: false }
        pilot:
          test: >
            Size an upcoming project before it starts, then reconcile once it runs.
          mode: silo
          silo_scope: One sub-rule at a time (levels, concurrency, effort per instance).
          starts: 2026-11-23
          window: { earliest: 2026-12-12, latest: 2026-12-18, confirmed: false }
      - id: surface-area
        name: Surface area
        kind: measure
        statement: >
          How many units of work run at once, so need attention at the same
          time; sequenceable units take turns and do not add to it.
        formula: not_yet_defined
        inputs:
          - scope units
          - concurrency
        tool: size
        glossary_terms: [scope-unit]
        lives_in: capacity-model.yaml (surface area, concurrency)
        position: thinking
        moves_when: >
          A real engagement shows how concurrency and the calendar trade off.
      - id: required-level
        name: Required level
        kind: measure
        statement: >
          The level the work demands, set by collapse risk, not by who is
          available.
        formula: not_yet_defined
        inputs:
          - collapse risk
        tool: size
        glossary_terms: [level]
        lives_in: capacity-model.yaml (demanded_level)
        position: thinking
        moves_when: >
          Collapse risk has a definition a second person would score the same way.
      - id: effective-capacity
        name: Effective capacity
        kind: measure
        statement: >
          How much surface area one operator holds at the demanded level, given
          how far their caliber sits above it.
        formula: >
          effective_capacity = min(nominal_capacity[demanded_level] *
          multiplier_by_gap[gap], hard_ceiling)
        inputs:
          - demanded level
          - operator caliber
          - nominal capacity by level
          - multiplier by gap
          - hard ceiling
        tool: size
        glossary_terms: [level]
        lives_in: capacity-model.yaml (nominal_capacity, multiplier_by_gap, hard_ceiling)
        position: thinking
        moves_when: >
          The figures in capacity-model.yaml are recovered from real delivery
          and a human reviews them.
      - id: seat-count
        name: Seat count
        kind: measure
        statement: >
          How many seats the work needs: a ceiling from demand, and a floor from
          validated surface area only.
        formula: count = surface_area / effective_capacity
        inputs:
          - surface area
          - effective capacity
        tool: size
        glossary_terms: [seat]
        lives_in: capacity-model.yaml (count derivation, demanded_count, committed_count)
        position: thinking
        moves_when: >
          Surface area and required level have formulas, so the count is no
          longer built on gaps.
      - id: build-qa-segregation
        name: Build and QA segregation
        kind: check
        statement: >
          One person may not hold both Product & interface building and
          Validation & testing on the same engagement, whatever the scheduling
          says.
        condition: >
          Fails when one seat, or one title's default_executes, covers both
          capabilities of a segregated pair.
        inputs:
          - segregated_from pairs
          - seat assignments
          - title default_executes
        tool: segregation_check
        glossary_terms: [seat, title]
        lives_in: >
          capabilities/building/product-interface-building.yaml and
          capabilities/proof/validation-testing.yaml (segregated_from)
        position: thinking
        note: >
          The Forward Deployed Engineer default fails this check today, and
          that is an open decision for a human.
        moves_when: >
          A real staffing is run through the check and it flags what a person
          would also flag.
      - id: scope-gaps
        name: Undefined scope
        kind: check
        statement: >
          A capability with no scope block, or a missing field, is undefined
          and is never read as one.
        condition: >
          Fails for each capability with no scope_decomposition, a status of
          not_yet_defined, or a field left out.
        inputs:
          - scope_decomposition on each capability
        tool: gap_list
        glossary_terms: [scope-unit]
        lives_in: capabilities/*/*.yaml (scope_decomposition)
        position: thinking
        moves_when: >
          The gap list is read on a real engagement and nothing it reports is
          a surprise.
      - id: caliber-eligibility
        name: Caliber eligibility
        kind: check
        statement: >
          An operator below the demanded level is ineligible for the seat, not
          a smaller share of it.
        condition: Fails when operator_caliber minus demanded_level is below zero.
        inputs:
          - operator caliber
          - demanded level
        tool: gap_list
        glossary_terms: [level, seat]
        lives_in: capacity-model.yaml (caliber gap rule)
        position: thinking
        moves_when: >
          A real seat is checked and the ineligible calls match a human's.

  - id: roles-titles
    name: Roles & Titles
    position: mapping
    last_moved: 2026-10-06
    mapping:
      test: >
        Do the title bundles map cleanly onto the people from self-assessment?
      ends: { earliest: 2026-11-06, latest: 2026-11-27, confirmed: false }
    pilot:
      test: >
        Draft the next real SOW priced on capabilities at levels with no
        titles, and record sales and client reaction; this tests the existing
        rule and does not reopen it.
      mode: silo
      silo_scope: Tied to the next real SOW.
      starts: 2026-11-09
      window: { earliest: 2026-11-25, latest: 2026-11-30, confirmed: false }
    depends_on:
      - id: capability-levels
        reason: >
          A title is a bundle of capabilities at levels, so it cannot settle
          before the levels do.

  - id: staffing-harness
    name: Staffing harness
    position: thinking
    thinking_end: { earliest: 2026-10-20, latest: 2026-10-23, confirmed: false }
    mapping:
      test: >
        Run past staffings by hand and see whether the rules would have made
        the same calls.
      ends: { earliest: 2026-11-03, latest: 2026-11-06, confirmed: false }
    early_pilot:
      test: >
        Size and staff one upcoming project by hand with the levels, scope
        units and qualified pool, then reconcile once it runs.
      mode: silo
      silo_scope: One upcoming project, run manually.
      starts: 2026-11-06
      window: { earliest: 2026-11-18, latest: 2026-11-25, confirmed: false }
    pilot:
      test: >
        Run the full staffing harness with adapted levels, scope units, and the qualified
        pool together.
      mode: joint
      with:
        - capability-levels
        - sizing-staffing-rules
        - roles-titles
      starts: 2026-12-07
      window: { earliest: 2027-01-05, latest: 2027-01-15, confirmed: false }
      note: >
        A manual run can happen sooner. True automation depends on the agent
        harness build, so it waits for it.
    depends_on:
      - id: roles-titles
        reason: >
          The briefing stops at the qualified pool, and resourcing reads
          titles to fill it.
      - id: sizing-staffing-rules
        reason: >
          The harness needs to know how many instances of each capability the
          pilot's work calls for.

  - id: esoa-harness
    name: ESOA harness
    position: thinking
    note: Designed; refresh trigger open.
    thinking_end: { earliest: 2026-10-30, latest: 2026-11-20, confirmed: false }

loop:
  ring:
    - capability-levels
    - roles-titles
    - staffing-harness
    - sizing-staffing-rules
    - ai-native-sdlc
    - operating-view
  callout: >
    Asking when roles and titles will be done is really asking when levels
    settle, when sizing exists for the pilot's capabilities, and when staffing
    has run once to check them.

done:
  - group: The model
    items:
      - Six domains with 26 capabilities, each on the L1 to L4 execution scale.
      - Five titles, with every capability owned by exactly one.
      - Thirteen definitions, each with the confusions it rules out.
      - Scope Units, defined for one capability with the gap shown on the rest.
  - group: How work runs
    items:
      - The AI-Native SDLC, seven stages plus its agentic mode.
      - Eight risk shapes, the intensity dial, and five seams.
      - Four doctrines, including New Discovery and what happens when work changes.
      - The build and QA seat rule.
  - group: Infrastructure
    items:
      - YAML as the source of truth, with a schema and validator for every entity.
      - A generated site, rebuilt from the YAML.
      - A read-only MCP server that agents use to read the model.
      - Visibility tiers and a private overlay path for internal data.
  - group: Harnesses (work in progress)
    items:
      - "Staffing and capability mapping: designed; ledger schema undefined."
      - "ESOA: designed; refresh trigger open."
      - "Evidence Work: drafted; may trail the pilot."

# What is being actively worked on next. A human sets this list, two or three
# items at most; it is not derived and not a plan.
tomorrow:
  - item: Self-assessment of people's capability execution levels
    note: It also checks the capability levels themselves.
  - item: Settling the terms the model rests on
    note: Levels, scope units, concurrency and the like.
  - item: Staffing harness ideation

decisions:
  - Which 2 to 3 running engagements and which 3 to 4 recent projects to map against.
  - The summarizer proposes changes through a reviewed PR and never writes directly.
  - How required levels get set for a seat.
  - The Forward Deployed Engineer default breaks the build and QA seat rule.
  - The ESOA refresh trigger, signal-driven with a time fallback.

range_drivers:
  pushes_late:
    - A large re-cut of the levels.
    - Thin delivery data from the mapping engagements.
    - More than one round on scope units.
    - Holidays.
  pulls_early:
    - A pilot scoped to a few capabilities.
    - The ledger schema landing next week.
    - Letting the Evidence Work harness trail the pilot.
    - Running the staffing harness pilot manually, ahead of the agent harness build.

durations_note: >
  Dates and durations on this page are estimates, not commitments.
