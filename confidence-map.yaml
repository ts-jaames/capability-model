id: confidence-map
name: Confidence map
description: >
  This page shows how much we trust each part of our operating model. It is
  not a schedule. Every part sits in one of three columns, from least tested to
  most tested. A part moves right only after it has held up against real work,
  and moves back left if real work breaks it. A group, like the Capability
  Model, sits in the same column as its least tested part, and the number next
  to its name is how many parts it has. Open a group to see them.
status: draft
owner: Operating Model
source: original
last_updated: 2026-10-01
positions_reviewed: false

# What is being worked on right now. Refreshed after 4 hours of work in the repo
# (see CLAUDE.md; `npm run today` reports its age). `updated` is local time with
# its offset, and the page counts up from it.
today:
  updated: 2026-10-06T08:08:58-05:00
  text: >
    Reconciling our SDLC with Anthropic's SDLC model and Atlassian's, and
    discussing roles and titles as part of it. This follows the Engagement Lead
    rename and the rewrite of the landing page as Core Philosophy.

note: >
  This file is edited by a human. Nothing in it moves on its own, and no
  assistant promotes a part without being told to. Every part starts in the
  first column because that claims the least. `positions_reviewed` stays false
  until a human has gone through and set where each part really sits.

  There are no dates for the future here, on purpose. `last_moved` records when
  a part last changed column, which is history. `moves_when` records what has
  to be true for it to move right, which is the honest answer to "how long".

  A row with parts sits where its weakest part sits. Do not set `position` on a
  row that has `items`; it is worked out from them. A part with a `stage`
  takes its name from the lifecycle named on the row, so a renamed stage cannot
  leave this file stale.

columns:
  - id: thinking
    name: Thinking Time
    meaning: >
      We have written it down and talked it through. We have not tried it on a
      real engagement yet.
  - id: mapping
    name: Current engagement mapping
    meaning: >
      We are checking it against engagements that are already running, to see
      what holds up and what does not.
  - id: pilot
    name: Pilot use
    meaning: >
      We are using it on an upcoming live project and feeding what we learn
      back in.

