id: seat-fulfilment
name: How seats get filled
summary: >
  Once the SOW is signed, its capabilities-at-levels are the seat list — seats
  are read off the contract, not designed.
rule: >
  L4 qualifies; resourcing assigns — kept apart so logistics can't quietly
  lower a seat's level.
steps:
  - name: Qualification
    description: >
      Who can fill it. Each capability's L4 certifies who can execute it at
      each level. The qualified pool is the L4, plus anyone they've certified
      to that level.
  - name: Assignment
    description: >
      Who does. A resourcing function assigns from the qualified pool by
      availability, continuity, development, and fit.
closing_note: >
  Recorded in two places, neither on the SOW: capability profiles (firm-level —
  person, capability, certified level) and engagement staffing (per-engagement,
  internal, changeable).
status: draft
owner: Operating Model
source: original
