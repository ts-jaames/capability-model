id: commercial-stack
name: What the SOW shows
summary: >
  The client-facing SOW is three layers. Only the top is sold; the middle
  justifies the number when asked; the bottom never appears.
rule: >
  The client buys the outcome. Titles are internal and never reach the
  contract or the rate card.
steps:
  - name: Outcome
    description: >
      What is sold and priced — "we'll build the integration hub". This is the
      promise the contract makes.
  - name: Capabilities at levels
    description: >
      The price justification, surfaced if the client asks how the number was
      reached. A capability at a level is what sets the price, and the level is
      the seniority signal the SOW carries.
    capabilities:
      - commercial-scoping-envelope-shaping
      - pricing-under-uncertainty
  - name: Seats
    description: >
      How we assemble it. Hidden. Never on the SOW, because staffing is our
      problem to solve and re-solve as the work moves.
closing_note: >
  A pair of single-spike owners and one M-shaped person can fulfil the same
  line. The contract doesn't care which.
status: draft
owner: Operating Model
source: original
